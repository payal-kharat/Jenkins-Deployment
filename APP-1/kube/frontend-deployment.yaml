apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: app-1

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app1-frontend

  template:
    metadata:
      labels:
        app: app1-frontend

    spec:
      containers:
        - name: frontend
          image: python:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
